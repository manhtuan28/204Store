services:
  # Cơ sở dữ liệu Microsoft SQL Server 2022
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: store204-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Store204@StrongPassword!}"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" ||
        /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" ||
        exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - store204-net

  # Ứng dụng Web ASP.NET Core 8 MVC
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store204-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=204Store;User Id=sa;Password=${DB_PASSWORD:-Store204@StrongPassword!};TrustServerCertificate=True;MultipleActiveResultSets=true;Connect Timeout=60"
    ports:
      - "${WEB_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - store204_uploads:/app/wwwroot/uploads
      - store204_images:/app/wwwroot/images
    networks:
      - store204-net

networks:
  store204-net:
    driver: bridge

volumes:
  mssql_data:
    driver: local
  store204_uploads:
    driver: local
  store204_images:
    driver: local
